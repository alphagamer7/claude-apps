name: driftnote
description: "Capture voice memos that auto-transcribe and organize by date."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  speech_to_text: ^7.0.0
  record: ^6.1.2
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  intl: ^0.20.2
  audioplayers: ^6.1.0
  uuid: ^4.5.1
  permission_handler: ^11.3.1
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
